<!doctype html>
<html lang="id" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PixelSave - Financial Manager 8-Bit</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="title" content="PixelSave" />
    <meta name="description" content="Aplikasi catat keuangan bertema Retro 8-Bit / 90s OS dengan kalkulasi saldo otomatis dan pelacak progres tabungan." />
    <meta name="theme-color" content="#005ac2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PixelSave" />

    <!-- Favicon & Apple Touch Icon (HTTPS PNG) -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/1006/1006583.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="https://cdn-icons-png.flaticon.com/512/1006/1006583.png" />

    <!-- Web App Manifest Link -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="font-body-md text-[#1b1b1c] min-h-screen selection:bg-[#fe8b6d] selection:text-[#1b1b1c]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PixelSave PWA] Service Worker registered:', reg.scope);
            })
            .catch((err) => {
              console.log('[PixelSave PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
